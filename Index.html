<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Alert</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --accent-red: #ef4444;
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navbar */
    header {
      background: #090d16;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #1e293b;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent-red);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Stats Bar - Double click to trigger Admin */
    .user-stats {
      display: flex;
      gap: 15px;
      background: var(--bg-card);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 0.9rem;
    }

    .stat-tokens { color: var(--accent-gold); font-weight: 800; }
    .stat-exp { color: var(--accent-blue); font-weight: 800; }

    /* Nav Bar */
    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: #0b1329;
      overflow-x: auto;
    }

    .nav-btn {
      background: var(--bg-card);
      color: var(--text-sub);
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
      white-space: nowrap;
    }

    .nav-btn.active, .nav-btn:hover {
      color: #fff;
      background: var(--accent-red);
    }

    main {
      flex: 1;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .page { display: none; }
    .page.active { display: block; }

    /* Dashboard & Profile Card */
    .profile-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .avatar-circle {
      font-size: 3.5rem;
      background: #0f172a;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px auto;
      border: 3px solid var(--accent-red);
    }

    .claim-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    /* Market / Packs */
    .market-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .pack-box {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      border: 2px solid transparent;
      transition: 0.2s;
    }

    .pack-box:hover {
      border-color: var(--accent-red);
      transform: translateY(-3px);
    }

    .buy-pack-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 900;
      width: 100%;
      margin-top: 15px;
      cursor: pointer;
    }

    /* Locker / Blooks */
    .blook-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 12px;
    }

    .blook-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 15px 10px;
      text-align: center;
      border: 2px solid #334155;
    }

    .blook-emoji { font-size: 2.2rem; margin-bottom: 5px; }

    /* Bazaar / Trading */
    .bazaar-container {
      background: var(--bg-card);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
    }

      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba
